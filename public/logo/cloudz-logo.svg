<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" fill="none">
  <defs>
    <linearGradient id="cz-blue" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C93FF" />
      <stop offset="0.5" stop-color="#0066FF" />
      <stop offset="1" stop-color="#0036A6" />
    </linearGradient>
    <linearGradient id="cz-silver" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.55" stop-color="#D3DBE6" />
      <stop offset="1" stop-color="#9AA6B8" />
    </linearGradient>
    <filter id="cz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#0066FF" flood-opacity="0.55" />
    </filter>
  </defs>

  <g filter="url(#cz-glow)" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="900">
    <!-- Big blue C -->
    <text x="-4" y="96" font-size="128" fill="url(#cz-blue)" stroke="#EAF2FF" stroke-width="2.5" paint-order="stroke">C</text>
    <!-- Silver S -->
    <text x="86" y="104" font-size="118" fill="url(#cz-silver)" stroke="#0D1117" stroke-width="2" paint-order="stroke">S</text>
    <!-- .net tag -->
    <text x="176" y="104" font-size="40" fill="url(#cz-blue)" stroke="#EAF2FF" stroke-width="1.5" paint-order="stroke">.net</text>
  </g>
</svg>
